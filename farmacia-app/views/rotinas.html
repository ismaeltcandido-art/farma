<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<script src="__BASE__/assets/sync.js"></script>
<title>Rotinas da Farmácia – Temperatura, Limpeza e Resíduos</title>
<style>
/* ===== Farmavip · base visual compartilhada (Rotinas + Declarações) ===== */
:root{
 --ink:#17332e;--ink2:#41605a;--mut:#667d77;--line:#dbe4df;--line2:#e9efec;
 --paper:#f3f6f3;--bg:#f3f6f3;--card:#fff;
 --brand:#1f8f79;--brand-d:#0f5a4c;--teal:#1a7a68;--teal-d:#0f5a4c;--wash:#e7f3ee;
 --plum:#7a1a4e;--plum-w:#f6e8f0;
 --ok:#1f8a5b;--ok-w:#dff1e8;--warn:#b97300;--warn-w:#fcecc8;--bad:#c0392b;--bad-w:#fbe1de;--blue:#3b73b9;
 --disp:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
 --txt:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
 --r-card:16px;--r-ctl:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--txt);color:var(--ink);background:var(--paper);line-height:1.4}
:focus-visible{outline:3px solid #6dbfaa;outline-offset:2px}
button,input,select,textarea{font-family:inherit}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* barra superior: uma só navegação para o sistema inteiro */
.bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;flex:none}
.brand img{height:34px;width:auto;display:block}
.switch{display:flex;gap:4px;background:var(--wash);padding:4px;border-radius:14px}
.switch a{display:flex;align-items:center;gap:9px;padding:9px 20px;border-radius:10px;font:600 15px var(--txt);color:var(--brand-d);text-decoration:none;white-space:nowrap}
.switch a svg{width:20px;height:20px;flex:none}
.switch a:hover{background:#d3eadf}
.switch a[aria-current=page]{background:var(--brand-d);color:#fff}
.bar-sp{flex:1}
.bar-date{color:var(--mut);font-size:13px;white-space:nowrap}
.btn-pres{display:flex;align-items:center;gap:8px;border:1.5px solid var(--plum);color:var(--plum);background:#fff;border-radius:12px;padding:9px 16px;font:600 14px var(--txt);cursor:pointer;white-space:nowrap}
.btn-pres svg{width:18px;height:18px;flex:none}
.btn-pres:hover{background:var(--plum-w)}
body.pres .btn-pres{background:var(--plum);color:#fff}
@media(max-width:760px){
 .bar-in{gap:10px;padding:8px 12px;flex-wrap:wrap}
 .bar-date{display:none}
 .switch a{padding:8px 12px;font-size:14px}
 .brand img{height:28px}
 .btn-pres span{display:none}
}

/* botões e etiquetas */
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--wash);border-color:#bcd8cd}
.btn.p{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.btn.p:hover{background:#0b4a3e}
.btn.s{background:#fff}
.btn.del{background:#fff;color:var(--bad);border-color:#efc5c0}
.btn.del:hover{background:var(--bad-w)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#17724a}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.big{font-size:18px;padding:16px 18px;border-radius:14px;width:100%}
a.btn{text-decoration:none;display:inline-block}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-w);color:#14653f}.chip.pend{background:var(--warn-w);color:#7a4d00}.chip.bad{background:var(--bad-w);color:#9a2a1e}.chip.mut{background:#eaeeec;color:var(--mut)}
label{display:block;font-size:12.5px;color:var(--ink2);margin:9px 0 3px;font-weight:600}
input,select,textarea{width:100%;font-size:14px;padding:9px 10px;border:1px solid #c9d7d1;border-radius:var(--r-ctl);background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #b5ded2;border-color:var(--brand)}
input[type=checkbox]{width:auto}
.hint{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.4}

/* ===== Rotinas ===== */
body{font-size:14px}
.subbar{background:#fff;border-bottom:1px solid var(--line)}
.subbar-in{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.subbar .tabs{display:flex;gap:2px;flex-wrap:wrap}
.subbar .tabs button{border:0;border-radius:0;background:none;padding:14px 14px 11px;font:600 14.5px var(--txt);color:var(--ink2);cursor:pointer;border-bottom:3px solid transparent}
.subbar .tabs button:hover{color:var(--brand-d);background:none}
.subbar .tabs button.on{color:var(--brand-d);border-bottom-color:var(--brand);background:none}
.mnav{display:flex;align-items:center;gap:4px}
.mnav b{min-width:140px;text-align:center;font-family:var(--disp);font-weight:600;font-size:15px}
.mnav button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.mnav button:hover{background:var(--wash)}
.wrap{max-width:1240px;margin:0 auto;padding:6px 20px 40px}
.today{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px}

/* na aba Cedo/Tarde e outros seletores pequenos */
.tabs button.pillb,.hcard .tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer;color:var(--ink);font-weight:600}
.hcard .tabs{display:flex;gap:6px}
.hcard .tabs button.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px;margin-top:14px}
.card h2{margin:0 0 4px;font:600 17px var(--disp);letter-spacing:.005em}
.card .sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{position:sticky;top:0;background:#eef4f1;text-align:left;font-size:12px;color:var(--ink2);padding:8px 6px;border-bottom:1px solid var(--line);z-index:1;font-weight:600}
.tb td{padding:3px 4px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tb tr.cl td{background:#f6f8f7;color:var(--mut)}
.tb td.lab{font-style:italic}
.tb input[type=number],.tb input[type=text],.tb input[type=time],.tb input[type=date],.tb select{width:100%;min-width:62px;font-size:13px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.tb input.bad{background:var(--bad-w);border-color:var(--bad);color:#8f2218;font-weight:700}
.tb input.warn{background:#fff3d6;border-color:#e0a21b}
.tb td.d{white-space:nowrap;font-weight:600;width:62px}
.tb td.d small{color:var(--mut);font-weight:400}
.tb .al{font-size:12px;color:#9a2a1e;min-width:150px}.tb .al .w{color:#7a4d00}
.scroll{overflow-x:auto;max-height:640px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fafcfb}
.stat .l{font-size:12px;color:var(--mut)}
.stat .v{font:600 22px var(--disp);color:var(--brand-d);margin-top:2px;font-variant-numeric:tabular-nums}
.stat.bad{background:var(--bad-w);border-color:#efc5c0}.stat.bad .v{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f input,.f select,.f textarea{width:100%;font-size:14px;padding:8px 10px;border:1px solid #c9d7d1;border-radius:9px}
.f textarea{min-height:110px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.hint2{font-size:13.5px;color:var(--mut);margin:4px 0 8px}
.note{background:var(--warn-w);border:1px solid #efd58a;color:#6f4700;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px}

/* ---- tela Hoje: duas colunas, tarefas à esquerda e pendências à direita ---- */
.home{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0 20px;align-items:start}
@media(max-width:1020px){.home{grid-template-columns:1fr}}
.hbig .hdate{font-size:14px;color:var(--mut)}.hbig .hdate::first-letter{text-transform:uppercase}
.hbig .htitle{font:600 28px/1.15 var(--disp);margin:4px 0 12px;letter-spacing:-.005em}
.hbar{height:12px;border-radius:99px;background:#e1eae6;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.hcard h2{font-size:19px;margin-bottom:2px}
.hcard>.row:first-child{margin-bottom:10px}
.hcard .sgrid{margin-top:12px}
.hl{display:grid;grid-template-columns:1fr;gap:6px;border-top:1px solid var(--line);padding:12px 0}
.hf{display:flex;gap:8px;flex-wrap:wrap}
.hf div{flex:1;min-width:84px}
.hf label{margin:0 0 2px}
.hf input{width:100%;font-size:22px;padding:10px;border:2px solid var(--line);border-radius:10px;text-align:center}
.hf input.bad{background:var(--bad-w);border-color:var(--bad);color:#8f2218}
.step-h{display:flex;align-items:center;gap:12px}
.step-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--wash);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font:700 15px var(--disp)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13.5px}
.side-card h2{font-size:16px}
.side-decl{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.side-decl h2{color:#fff}.side-decl .hint2{color:#bfe0d6}
.side-decl .btn{background:#fff;color:var(--brand-d);border-color:#fff}
.side-decl .btn:hover{background:var(--wash)}

/* ---- cartões de sensor ---- */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:10px}
.sc{background:#f5f8f6;border:2px solid transparent;border-radius:16px;padding:14px 16px 12px}
.sc.pick{cursor:pointer;user-select:none}.sc.pick:hover{background:#ebf3ef}
.sc.sel{border-color:var(--brand);background:#fff}
.sc.bad{border-color:#efc0ba;background:#fdf3f1}
.sc .sh{display:grid;grid-template-columns:38px 1fr;gap:6px 12px;align-items:center}
.sc .sh>span{grid-column:2;justify-self:start}
.sc .sib{flex:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--brand-d)}
.sc .sib svg{width:22px;height:22px}
.sc .shm{flex:1;min-width:0}
.sc .stt{font-weight:700;font-size:15px;line-height:1.2}.sc .sst{color:var(--mut);font-size:12.5px;margin-top:2px}
.sc .sms{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:14px;text-align:center}
.sc .sm{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.sc .sm svg{width:26px;height:26px;color:#3b4a4c}
.sc .sv{font:600 22px var(--disp);display:flex;align-items:baseline;justify-content:center;gap:3px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc .sv small{font:600 12px var(--txt);color:var(--mut)}
.sc .sl{font-size:12px;color:var(--mut)}
.sc input{width:76px;font:600 22px var(--disp);text-align:center;border:0;border-bottom:2px solid #c3d3cc;background:transparent;padding:2px 0;border-radius:0;color:var(--ink)}
.sc input:focus{outline:0;border-bottom-color:var(--brand)}
.sc input.bad{color:#8f2218;border-bottom-color:var(--bad);background:var(--bad-w)}
.sc .sm.ok svg,.sc .sv.ok{color:var(--ok)}.sc .sm.badm svg,.sc .sv.badm{color:var(--bad)}.sc .sm.mut svg{color:#9db0aa}
.sc .sfoot{margin-top:10px;font-size:12px;color:var(--mut);text-align:center}

/* ---- folhas A4 (impressão / prévia) ---- */
.sheet{background:#fff;width:794px;max-width:100%;min-height:1000px;margin:14px auto;padding:34px 40px 30px;border:1px solid var(--line);box-shadow:0 6px 24px rgba(15,60,50,.10);display:flex;flex-direction:column}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;border-bottom:2px solid var(--brand-d);padding-bottom:10px}
.sheet .head img{height:54px}
.sheet .head div{text-align:right;font-size:11.5px;line-height:1.5;color:#40585b}
.sheet h3{text-align:center;font-size:19px;margin:16px 0 2px}
.sheet .ps{text-align:center;font-size:12.5px;color:var(--mut);margin-bottom:8px}
.sheet table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
.sheet th{text-align:left;font-size:10px;color:var(--mut);border-bottom:1px solid #9fb3b5;padding:3px 4px}
.sheet td{padding:2px 4px;border-bottom:1px solid #e6eded}
.sheet td:first-child{white-space:nowrap}.sheet td.r{color:#a32b2b;font-weight:700}.sheet tr.cl td{color:var(--mut);background:#f6f8f8}
.sheet .sg{margin-top:auto;padding-top:26px;text-align:center}
.sheet .sg .ln{border-top:1px solid #9fb3b5;width:62%;margin:0 auto 6px}
.sheet .sg small{display:block;color:var(--mut);font-size:10.5px}
.pbar{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

/* ---- modo apresentação (fiscalização) ---- */
body.pres{background:#eef2ef}
body.pres .subbar,body.pres #today{display:none!important}
body.pres .wrap{padding-top:0}
.pv-hero{margin-top:18px;background:var(--brand-d);color:#fff;border-radius:20px;padding:26px 30px;display:grid;grid-template-columns:auto 1fr auto;gap:26px;align-items:center}
.pv-logo{background:#fff;border-radius:14px;padding:12px 16px}
.pv-logo img{height:50px;display:block}
.pv-hero h1{margin:0;font:600 30px/1.1 var(--disp);letter-spacing:-.005em}
.pv-hero p{margin:6px 0 0;color:#cfe8df;font-size:14.5px;line-height:1.5}
.pv-lic{text-align:right;border-left:1px solid rgba(255,255,255,.25);padding-left:26px;min-width:220px}
.pv-lic b{display:block;font:600 22px var(--disp)}
.pv-lic span{font-size:13px;color:#cfe8df}
@media(max-width:900px){.pv-hero{grid-template-columns:1fr}.pv-lic{text-align:left;border:0;padding:0}}
.pv-nav{position:sticky;top:58px;z-index:15;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px}
.pv-nav button,.pv-nav a{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:11px;padding:12px 20px;font:600 16px var(--txt);color:var(--ink2);cursor:pointer;text-decoration:none}
.pv-nav button:hover,.pv-nav a:hover{background:var(--wash)}
.pv-nav button.on{background:var(--brand-d);color:#fff}
.pv-nav a.decl{background:var(--plum);color:#fff}.pv-nav a.decl:hover{background:#5f143c}
.pv-nav .sp{flex:1}
.pv-nav .exit{color:var(--mut);font-size:14px;font-weight:600}
.pv-sec{margin-top:18px}
.pv-sec>h2{font:600 22px var(--disp);margin:0 0 10px}
.health{display:flex;height:22px;border-radius:99px;overflow:hidden;background:#e1eae6;gap:3px}
.health i{display:block;height:100%;min-width:6px}
.health .ok{background:var(--ok)}.health .soon{background:#e0a21b}.health .exp{background:var(--bad)}.health .nolink{background:#a9b9b3}.health .miss{background:#7a1a4e}
.hleg{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font-size:14.5px}
.hleg span{display:flex;align-items:center;gap:7px}
.hleg b{font:600 18px var(--disp)}
.hleg u{display:inline-block;width:12px;height:12px;border-radius:50%;text-decoration:none}
.u-ok{background:var(--ok)}.u-soon{background:#e0a21b}.u-exp{background:var(--bad)}.u-nolink{background:#a9b9b3}.u-miss{background:#7a1a4e}
.pv-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pv-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.pv-box .t{font-weight:600;color:var(--ink2);font-size:14.5px}
.pv-box .n{font:600 40px/1.1 var(--disp);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.pv-box .n small{font:600 16px var(--txt);color:var(--mut)}
.pv-box .s{font-size:13.5px;color:var(--mut)}
.pv-box .hbar{margin-top:10px}
.pv-box.bad .s{color:var(--bad);font-weight:600}
.dg{margin:22px 0 8px;font:600 18px var(--disp);color:var(--brand-d)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:8px}
@media(max-width:560px){.dgrid{grid-template-columns:1fr}}
.dr{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.dr .dn{font-weight:600;font-size:15.5px}.dr .ds{font-size:13px;color:var(--mut);margin-top:2px}
.dr .row{flex:none;flex-wrap:nowrap}
.pv-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pv-reg .tb{font-size:15px}.pv-reg .tb th{font-size:13px;padding:10px 8px}.pv-reg .tb td{padding:10px 8px}
body.pres .btn.p{background:var(--brand-d)}

@page{size:A4;margin:0}
@media print{
 body{background:#fff}.wrap{padding:0;max-width:none}
 .noprint,.bar,.subbar,.today,.pbar{display:none!important}
 .sheet{box-shadow:none;border:0;margin:0;width:210mm;min-height:297mm;page-break-after:always}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>
</head>
<body>
<header class="bar noprint">
 <div class="bar-in">
  <div class="brand"><img id="logo" alt="Farmavip Dr Trajano"></div>
  <nav class="switch" aria-label="Seções do sistema">
   <a id="navRot" href="rotinas.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/></svg>Rotinas</a>
   <a id="navDecl" href="declaracao-farmaceutica.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Declarações</a>
  </nav>
  <div class="bar-sp"></div>
  <div class="bar-date" id="bardate"></div>
  <button class="btn-pres" id="presBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 21h8M12 16v5"/></svg><span>Modo apresentação</span></button>
 </div>
</header>
<div class="subbar noprint"><div class="subbar-in">
 <div class="tabs" id="tabs">
  <button data-t="home">Hoje</button><button data-t="temp">Temperatura</button><button data-t="clean">Limpeza</button><button data-t="waste">Resíduos infectantes</button><button data-t="fisc">Fiscalização</button><button data-t="cfg">Ajustes</button>
 </div>
 <div class="mnav"><button id="pm" aria-label="Mês anterior">◀</button><b id="mlabel"></b><button id="nm" aria-label="Próximo mês">▶</button></div>
</div></div>
<div class="wrap">
 <div class="today noprint" id="today"></div>
 <div id="main"></div>
</div>

function barSVG(vals,labels,unit){

function nextWaste(){
  const all=db.waste.filter(w=>w.d<=todayStr).map(w=>w.d).sort(),last=all[all.length-1];if(!last)return null;

}

let armed={};
function arm(key,btn,txt,fn){if(armed[key]){armed[key]=0;fn();return}armed[key]=1;const o=btn.textContent;btn.textContent=txt;setTimeout(()=>{armed[key]=0;if(btn.isConnected)btn.textContent=o},4000)}
const M=$('main');
M.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.l){e.preventDefault();ui.loc=e.target.dataset.l;render()}});
M.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.per){ui.per=t.dataset.per;render();return}
  if(t.dataset.hopen){db.status[todayStr]='aberto';save();render();return}
  if(t.dataset.hclean){const r=db.clean[todayStr]=db.clean[todayStr]||{};r.k=tasks().map(()=>1);const n=new Date();r.h=pad(n.getHours())+':'+pad(n.getMinutes());r.v=r.v||db.cfg.rub;save();render();return}
  if(t.dataset.hundo){delete db.clean[todayStr];save();render();return}
  if(t.id==='hwaste'){const kg=parseNum($('hkg').value);if(!(kg>0)){$('hwmsg').textContent='Digite o peso em kg.';return}db.waste.push({id:'w'+Date.now(),d:todayStr,kg:kg,col:'',o:''});save();render();$('hwmsg').textContent='Coleta registrada ✔ (complete coletor e comprovante em Resíduos).';return}
  if(t.dataset.go){const [y,m]=t.dataset.go.split('-').map(Number);ui.y=y;ui.m=m-1;ui.tab=t.dataset.gt;if(t.dataset.gl)ui.loc=t.dataset.gl;ui.print=false;render();const row=document.getElementById((t.dataset.gt==='temp'?'r-':'c-')+t.dataset.go);if(row){row.scrollIntoView({block:'center'});row.style.outline='3px solid #e0a21b'}return}
  const pr=t.closest&&t.closest('[data-pres]');if(pr){setPres(pr.dataset.pres==='1');return}
  const ptb=t.closest&&t.closest('[data-pt]');if(ptb){ui.pt=ptb.dataset.pt;render();window.scrollTo(0,0);return}
  if(t.closest&&t.closest('[data-po]')){ui.po=!ui.po;render();return}
  if(t.dataset.dsug){db.docs=DOC_SUG.map((x,i)=>({id:'d'+Date.now()+i,cat:x[0],name:x[1],num:'',val:'',link:'',na:0}));save();render();return}
  if(t.dataset.dadd){db.docs.push({id:'d'+Date.now(),cat:'Outros',name:'Novo documento',num:'',val:'',link:'',na:0});save();render();return}
  if(t.dataset.ddel){const id=t.dataset.ddel;arm('d'+id,t,'certeza?',()=>{db.docs=db.docs.filter(x=>x.id!==id);save();render()});return}
  if(t.dataset.fp){ui.back='fisc';ui.print=true;if(t.dataset.fp==='dossie'){ui.tab='fisc'}else{ui.y=now.getFullYear();ui.m=+t.dataset.fm;ui.tab=t.dataset.fp;ui.all=(t.dataset.fp==='temp')}render();window.scrollTo(0,0);return}
  if(t.dataset.print!==undefined){ui.print=t.dataset.print==='1';if(ui.print){ui.all=false;ui.back=null}else if(ui.back){ui.tab=ui.back;ui.back=null;ui.all=false}render();return}
  if(t.id==='doprint'){try{window.print()}catch(err){}return}
  const lb=t.closest&&t.closest('[data-l]');if(lb){ui.loc=lb.dataset.l;render();return}
  if(t.dataset.all){const date=t.dataset.all,r=db.clean[date]=db.clean[date]||{};r.k=tasks().map(()=>1);if(!r.h){const n=new Date();r.h=pad(n.getHours())+':'+pad(n.getMinutes())}if(!r.v)r.v=db.cfg.rub;save();render();return}
  if(t.id==='addw'){const date=(ui.y===now.getFullYear()&&ui.m===now.getMonth())?todayStr:ymd(ui.y,ui.m,1);db.waste.push({id:'w'+Date.now(),d:date,kg:0,col:'',o:''});save();render();return}
  if(t.dataset.wdel){const id=t.dataset.wdel;arm('w'+id,t,'certeza?',()=>{db.waste=db.waste.filter(w=>w.id!==id);save();render()});return}
  if(t.id==='exp'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='backup-rotinas-farmacia.json';a.click();$('cfgMsg').textContent='Backup gerado. Se nada foi baixado, abra o arquivo HTML no navegador.'}catch(err){$('cfgMsg').textContent='Não foi possível baixar aqui. Abra o arquivo HTML no navegador.'}return}
  if(t.id==='reset'){arm('reset',t,'Clique de novo para confirmar',()=>{db=freshDB();save();render()});return}
});

  if(t.dataset.dna){const d=db.docs.find(x=>x.id===t.dataset.dc);if(d){d.na=t.checked?1:0;save();render()}return}
  if(t.dataset.st){const date=t.dataset.st;if(t.value)db.status[date]=t.value;else delete db.status[date];save();render();return}
  if(t.dataset.cd&&t.dataset.ck!==undefined){const r=db.clean[t.dataset.cd]=db.clean[t.dataset.cd]||{};r.k=r.k||[];r.k[+t.dataset.ck]=t.checked?1:0;if(t.checked&&!r.h){const n=new Date();r.h=pad(n.getHours())+':'+pad(n.getMinutes())}if(t.checked&&!r.v)r.v=db.cfg.rub;save();render();return}
  if(t.dataset.w&&t.dataset.f==='d'){const w=db.waste.find(x=>x.id===t.dataset.w);if(w){w.d=t.value;save();render()}return}
  if(t.id==='imp'){const f=t.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.temp||!o.clean||!o.waste)throw 0;db=o;db.cfg=Object.assign({},CFG0,db.cfg||{});save();render()}catch(err){$('cfgMsg').textContent='Arquivo de backup inválido.'}};fr.readAsText(f);t.value=''}
});
M.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.dc&&t.dataset.df){const d=db.docs.find(x=>x.id===t.dataset.dc);if(d){d[t.dataset.df]=t.value;save();const c=$('ds-'+d.id);if(c)c.innerHTML=docChip(d);$('fsum').innerHTML=fiscCountsHTML()}return}
  if(t.dataset.hl){const v=t.value===''?null:parseNum(t.value);setTemp(todayStr,t.dataset.hl,t.dataset.hf,v);save();t.className=fieldBad(t.dataset.hl,t.dataset.hf,v,lim());updateHome();return}
  if(t.dataset.date&&t.dataset.f){const v=t.value===''?null:parseNum(t.value);setTemp(t.dataset.date,ui.loc,t.dataset.f,v);save();refreshTempRow(t.dataset.date);return}
  if(t.dataset.cd&&t.dataset.cf){const r=db.clean[t.dataset.cd]=db.clean[t.dataset.cd]||{};r[t.dataset.cf]=t.value;save();$('sumBox').innerHTML=cleanSummary();$('today').innerHTML=todayBanner();return}
  if(t.dataset.w&&t.dataset.f&&t.dataset.f!=='d'){const w=db.waste.find(x=>x.id===t.dataset.w);if(w){w[t.dataset.f]=t.dataset.f==='kg'?(parseNum(t.value)||0):t.value;save();$('sumBox').innerHTML=wasteSummary()}return}
  const m=t.id&&t.id.match(/^lim-(amb|est|ger)-(min|max|umax)$/);
  if(m){const v=parseNum(t.value);if(v!=null){db.cfg.lim[m[1]][m[2]]=v;save()}return}
  const c=t.id&&t.id.match(/^cfg-(\w+)$/);
  if(c){db.cfg[c[1]]=t.value;save()}
});
if(location.hash==='#apresentacao'){ui.pres=true;ui.tab='fisc';ui.pt='geral'}
render();
}
</script>
</body>
</html>
