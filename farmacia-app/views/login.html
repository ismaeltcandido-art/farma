<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Entrar – Farmácia Dr Trajano</title>
<style>
:root{--ink:#243b3d;--mut:#6b7f82;--line:#d9e3e4;--teal:#0b7a75;--teal-d:#0f4c5c;--bg:#f2f6f6;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.card{width:min(380px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 6px 24px rgba(15,76,92,.08)}
h1{margin:0 0 4px;font-size:20px;color:var(--teal-d)}
p{margin:0 0 18px;color:var(--mut);font-size:14px}
label{display:block;font-size:13px;margin:12px 0 4px;color:var(--mut)}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
input:focus{outline:2px solid var(--teal);border-color:transparent}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
#err{min-height:20px;margin-top:10px;font-size:13px;color:var(--bad)}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>Farmácia Dr Trajano</h1>
  <p>Declarações de serviços e rotinas. Entre para continuar.</p>
  <label for="u">Usuário</label>
  <input id="u" name="u" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="p">Senha</label>
  <input id="p" name="p" type="password" autocomplete="current-password" required>
  <button id="btn" type="submit">Entrar</button>
  <div id="err" role="alert"></div>
</form>
<script src="__BASE__/assets/login.js"></script>
</body>
</html>
